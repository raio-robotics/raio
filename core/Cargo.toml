[package]
name = "raio-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A deterministic realtime async runtime"
readme = "../README.md"
keywords = ["async", "runtime", "deterministic", "realtime", "asyncio"]
categories = ["asynchronous", "concurrency", "simulation"]

[lib]
name = "raio"

[dependencies]
bincode = {version = "2", features = ["serde"]}
const_format = "0.2.37" # Joins the crate version and the commit hash into `VERSION`.
elkrs = "0.1" # Lays out the diagram of an app.
futures = "0.3.34"
git-version = "0.3.9" # Reads the commit hash at compile time.
libc = "0.2" # Catches ^C in a launcher and ignores it in a node.
polling = "3"
raio-macros = {path = "macros", version = "0.2.0"} # Derives `Ports` and reads the tasks of a `#[node]` block. x-release-please-version
rmp-serde = "1" # MessagePack, the serializer that nodes in other languages share.
serde = {version = "1.0", features = ["derive"]}
serde_bytes = {version = "0.11", optional = true} # Encodes the value of a frame as one block of bytes.
serde_json = "1" # The graph that elkrs takes and returns.

[dev-dependencies]
async-io = "2" # Supplies the external timer used by the foreign-future example.

