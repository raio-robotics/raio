[package]
name = "raio-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A deterministic realtime async runtime"
readme = "../README.md"
keywords = ["async", "runtime", "deterministic", "realtime", "asyncio"]
categories = ["asynchronous", "concurrency", "simulation"]

[lib]
name = "raio"

[dependencies]
mio = { version = "1.2.2", features = ["net", "os-poll"] }
