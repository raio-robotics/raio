[package]
name = "raio-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A deterministic realtime async runtime"
readme = "../README.md"
keywords = ["async", "runtime", "deterministic", "realtime", "asyncio"]
categories = ["asynchronous", "concurrency", "simulation"]

[lib]
name = "raio"

[dependencies]
async-net = "2"
async-io = "2"
bincode = {version = "2", features = ["serde"]}
futures = "0.3.34"
serde = {version = "1.0", features = ["derive"]}

