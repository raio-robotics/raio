[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "raio-py"
description = "A deterministic realtime async runtime"
readme = "../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = ["cloudpickle", "msgpack"]

[tool.maturin]
python-source = "python"
module-name = "raio._rs.core"
features = ["extension-module"]
exclude = [
    "**/__pycache__/**",
    "**/*.py[cod]",
    "**/.pytest_cache/**",
    "**/.mypy_cache/**",
    "**/.ruff_cache/**",
    "**/.DS_Store",
]

[dependency-groups]
dev = ["pytest"]
