[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "raio-py"
description = "A deterministic realtime async runtime"
readme = "../README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dynamic = ["version"]

[tool.maturin]
module-name = "raio"
features = ["extension-module"]

[dependency-groups]
dev = ["pytest"]
