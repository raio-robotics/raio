name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title with commitizen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TITLE=$(gh pr view "$GITHUB_REF_NAME" --json title --jq .title)
          fi
          pipx run --spec commitizen==4.9.1 cz check --message "$TITLE"
